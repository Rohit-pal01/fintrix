version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fintrix_db
    environment:
      POSTGRES_DB: finance_copilot
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: copilot_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d finance_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fintrix_backend
    environment:
      - DATABASE_URL=postgresql://copilot_user:copilot_pass@db:5432/finance_copilot
      - READONLY_DATABASE_URL=postgresql://copilot_ro:copilot_ro_pass@db:5432/finance_copilot
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
