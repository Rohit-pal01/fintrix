services:
  - type: web
    name: fintrix
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/generate_data.py && python scripts/generate_sample_documents.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
